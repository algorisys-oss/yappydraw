<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Product Hunt feed thumbnail, 240x240. Built from YappyDraw's own logo mark
       (frontend/src/components/yappy-logo-mark.tsx) so the icon in the feed is the
       same one in the app's header. Deliberately NOT hand-drawn: sketch strokes turn
       to mush at this size, and a feed icon has to read at a glance. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- The mark, scaled from its 24x24 viewBox to fill the tile. -->
  <g transform="translate(36 36) scale(7)">
    <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"
          fill="none" stroke="#ffffff" stroke-width="1.7" opacity="0.95"/>
    <path d="M6.6 15.4c1.9-4.6 3.6-6.9 5.2-6.9 1.5 0 1.4 2.2 2.5 2.2 1 0 1.7-1.2 3.1-3.4"
          fill="none" stroke="#a5b4fc" stroke-width="2.1"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17.4" cy="7.3" r="1.9" fill="#a5b4fc"/>
  </g>
</svg>
